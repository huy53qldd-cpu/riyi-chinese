<!doctype html>
<!--
  Riyi — app học tiếng Trung cho người Việt đã biết tiếng Nhật.

  lang="vi" vì toàn bộ giao diện là tiếng Việt.
  Riêng các đoạn tiếng Trung và tiếng Nhật bên trong sẽ tự gắn lang="zh-CN"
  và lang="ja" của chúng, để trình duyệt vẽ đúng tự dạng.
-->
<html lang="vi" data-theme="sang" data-furigana="bat">
  <head>
    <meta charset="UTF-8" />

    <!--
      viewport-fit=cover: cho app tràn sát mép trên màn hình iPhone tai thỏ.
      Không đặt maximum-scale, để người dùng vẫn phóng to chữ được khi cần.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>Riyi — Học tiếng Trung cho người biết tiếng Nhật</title>
    <meta
      name="description"
      content="Học tiếng Trung HSK 1–3 bằng vốn Hán tự tiếng Nhật sẵn có. Đối chiếu chữ Hán, đồng tự dị nghĩa, từ vựng và ngữ pháp Trung – Nhật – Việt."
    />

    <!-- Màu thanh trạng thái điện thoại. Lấy đúng màu nền của 2 theme. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#FFF6E5"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#2A1F1A"
    />

    <link rel="icon" href="/hinh/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/hinh/icon-192.png" />
    <link rel="apple-touch-icon" href="/hinh/icon-180.png" />

    <!--
      PWA: cho phép "Thêm vào màn hình chính" và mở như một ứng dụng riêng.
      Tên, màu, icon cho Android nằm trong manifest.webmanifest.
      iPhone đọc thêm mấy dòng apple-* dưới đây.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Riyi" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!--
      Màn hình chờ (splash) cho iPhone/iPad, mỗi cỡ màn hình một ảnh.
      KHÔNG sửa tay khối dưới đây: chạy "npm run tao-splash" để tạo lại.
    -->
    <!-- SPLASH-BAT-DAU -->
    <!-- iPhone 16 Pro Max, 17 Pro Max -->
    <link rel="apple-touch-startup-image" href="/hinh/splash/splash-1320x2868.png"
      media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <!-- iPhone 16 Pro, 17, 17 Pro -->
    <link rel="apple-touch-startup-image" href="/hinh/splash/splash-1206x2622.png"
      media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <!-- iPhone 14 Pro Max, 15 Plus, 15 Pro Max, 16 Plus -->
    <link rel="apple-touch-startup-image" href="/hinh/splash/splash-1290x2796.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <!-- iPhone 14 Pro, 15, 15 Pro, 16 -->
    <link rel="apple-touch-startup-image" href="/hinh/splash/splash-1179x2556.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <!-- iPhone 12 Pro Max, 13 Pro Max, 14 Plus -->
    <link rel="apple-touch-startup-image" href="/hinh/splash/splash-1284x2778.png"
      media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <!-- iPhone 12, 12 Pro, 13, 13 Pro, 14, 16e -->
    <link rel="apple-touch-startup-image" href="/hinh/splash/splash-1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <!-- iPhone X, XS, 11 Pro, 12 mini, 13 mini -->
    <link rel="apple-touch-startup-image" href="/hinh/splash/splash-1125x2436.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <!-- iPhone XS Max, 11 Pro Max -->
    <link rel="apple-touch-startup-image" href="/hinh/splash/splash-1242x2688.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <!-- iPhone XR, 11 -->
    <link rel="apple-touch-startup-image" href="/hinh/splash/splash-828x1792.png"

    <!-- iPhone 6, 7, 8, SE 2, SE 3 -->
    <link rel="apple-touch-startup-image" href="/hinh/splash/splash-750x1334.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <!-- iPhone SE đời đầu -->
    <link rel="apple-touch-startup-image" href="/hinh/splash/splash-640x1136.png"

      media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <!-- iPad Pro 11 -->
    <link rel="apple-touch-startup-image" href="/hinh/splash/splash-1668x2388.png"
      media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <!-- iPad Air 10.9 -->
    <link rel="apple-touch-startup-image" href="/hinh/splash/splash-1640x2360.png"
      media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <!-- iPad, iPad mini đời cũ -->
    <link rel="apple-touch-startup-image" href="/hinh/splash/splash-1536x2048.png"
      media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <!-- iPad mini 8.3 -->
    <link rel="apple-touch-startup-image" href="/hinh/splash/splash-1488x2266.png"
      media="(device-width: 744px) and (device-height: 1133px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <!-- SPLASH-KET-THUC -->

    <!--
      Tải trước font tiếng Trung và tiếng Nhật.
      Hai font này là thứ nặng nhất của app, nên báo trình duyệt tải sớm để
      chữ Hán không bị hiện muộn.
    -->
    <link
      rel="preload"
      href="/fonts/noto-sans-sc-subset.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/noto-sans-jp-subset.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
