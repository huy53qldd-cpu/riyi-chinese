# =============================================================================
# GỬI THÔNG BÁO (quyết định 18.40, 18.57)
# =============================================================================
# KHÔNG dùng lịch cron của GitHub nữa: GitHub hay chạy trễ 3–5 tiếng (có hôm
# nhắc 21h tới lúc 1 giờ sáng). Thay vào đó, dịch vụ miễn phí cron-job.org cứ
# 5 phút gọi GitHub API "chạy workflow này" một lần (không kèm tham số, nên
# viec = tu-dong). Mỗi lần chạy, cong-cu/thong-bao/gui.js sẽ:
#   1. gửi các thông báo quản trị đang chờ (soạn trong Cài đặt của app),
#   2. gửi nhắc học 7h / 14h / 21h nếu khung đó vừa tới mà chưa gửi.
#
# Cách cài cron-job.org: tai-lieu/HUONG-DAN-THONG-BAO.md, mục "cron-job.org".
# CẦN GitHub Secret FIREBASE_SERVICE_ACCOUNT (cũng có trong hướng dẫn).
#
# Vẫn bấm chạy tay được (tab Actions → Run workflow) để thử một khung giờ.
# =============================================================================

name: Thông báo nhắc học

on:
  # DỰ PHÒNG: lịch của GitHub (hay trễ, có khi bỏ lượt) chạy 20 phút một lần,
  # cùng việc tu-dong. Không sợ gửi trùng vì gui.js ghi lại khung đã gửi; chạy
  # trễ quá 2 tiếng so với khung thì tự bỏ qua. Tránh phút 0 vì GitHub đông nhất.
  schedule:
    - cron: "3,23,43 * * * *"
  workflow_dispatch:
    inputs:
      viec:
        description: "tu-dong = việc của cron-job.org; khung = gửi ngay một khung nhắc học"
        required: false
        default: "tu-dong"
      khung:
        description: "Khi viec = khung: 7h, 14h hoặc 21h"
        required: false
        default: "7h"
      thu:
        description: "Chỉ chạy thử, không gửi thật"
        type: boolean
        required: false
        default: false

# Không cho hai lần chạy chồng nhau (lần sau đợi lần trước xong), để một thông
# báo không bị gửi hai lần
concurrency:
  group: thong-bao
  cancel-in-progress: false

jobs:
  gui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cong-cu/thong-bao/package-lock.json

      - name: Cài thư viện gửi thông báo
        working-directory: cong-cu/thong-bao
        run: npm ci --no-audit --no-fund

      - name: Gửi
        working-directory: cong-cu/thong-bao
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VIEC: ${{ inputs.viec }}
          KHUNG: ${{ inputs.khung }}
          THU: ${{ inputs.thu && '--thu' || '' }}
        run: |
          if [ "$VIEC" = "khung" ]; then
            node gui.js --khung "$KHUNG" $THU
          else
            node gui.js --tu-dong $THU
          fi
